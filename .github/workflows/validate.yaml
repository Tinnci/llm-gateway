name: Validate

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: 🔒 Check synchronized version sources
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" == "tag" && "${TAG_NAME}" == v* ]]; then
            python3 scripts/check_version_sync.py --with-tag "${TAG_NAME}"
          else
            python3 scripts/check_version_sync.py
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: 🛠️ Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: 🔒 Check uv.lock matches pyproject
        run: uv lock --check
      - name: 🛠️ Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: 🧹 Ruff check
        run: uv run ruff check custom_components tests tools/ha-earcon/src tools/ha-earcon/tests scripts
      - name: 🎨 Ruff format check
        run: uv run ruff format --check custom_components tests tools/ha-earcon/src tools/ha-earcon/tests scripts
      - name: 📦 Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: 🔎 Frontend typecheck
        run: bun run typecheck
      - name: Frontend tests
        run: bun test
      - name: 🧱 Build Voice Harness panel
        run: bun run build:panel
      - name: 🧪 Pytest
        run: uv run pytest -q
      - name: 🔊 Earcon tool tests
        working-directory: tools/ha-earcon
        run: uv run pytest -q

  validate-hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: 🏃 Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1
      - name: 🏃 HACS validation
        uses: hacs/action@22.5.0
        env:
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          comment: false
          # The repository uses PolyForm Noncommercial, which HACS/GitHub
          # reports as SPDX NOASSERTION even though LICENSE is present.
          ignore: license

  validate-homeassistant:
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7.0.1

      - name: 🛠️ Home Assistant configuration
        run: |
          mkdir ./test_configuration
          cp -r ./custom_components ./test_configuration
          echo "default_config:" >> ./test_configuration/configuration.yaml

      - name: 🏡 Home Assistant validation
        uses: ludeeus/setup-homeassistant@main
        with:
          tag: ${{ matrix.channel }}
          config-dir: test_configuration
