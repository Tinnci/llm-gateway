name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v4
      - name: 🔒 Check synchronized version sources
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" == "tag" && "${TAG_NAME}" == v* ]]; then
            python3 scripts/check_version_sync.py --with-tag "${TAG_NAME}"
          else
            python3 scripts/check_version_sync.py
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v4
      - name: 🛠️ Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 🔒 Check uv.lock matches pyproject
        run: uv lock --check
      - name: 🛠️ Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: 🧹 Ruff check
        run: uvx ruff check custom_components tests tools/ha-earcon/src tools/ha-earcon/tests scripts
      - name: 🎨 Ruff format check
        run: uvx ruff format --check custom_components tests tools/ha-earcon/src tools/ha-earcon/tests scripts
      - name: 📦 Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: 🔎 Frontend typecheck
        run: bun run typecheck
      - name: 🧱 Build Voice Harness panel
        run: bun run build:panel
      - name: 🧪 Pytest
        run: uv run pytest -q
      - name: 🔊 Earcon tool tests
        working-directory: tools/ha-earcon
        run: uv run pytest -q

  validate-hassfest:
    runs-on: ubuntu-latest
    # Keep hassfest visible, but do not block releases on upstream hassfest image
    # regressions. Stable/beta HA configuration validation remains required below.
    continue-on-error: true
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v4
      - name: 🧹 Hide frontend asset manifests from hassfest
        run: find custom_components/llm_gateway/frontend/earcons -name manifest.json -delete
      - name: 🏃 Hassfest validation
        uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v4
      - name: 🏃 HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # The domain is not yet in the home-assistant/brands repository.
          # The repository uses PolyForm Noncommercial, which HACS/GitHub
          # reports as SPDX NOASSERTION even though LICENSE is present.
          ignore: brands license

  validate-homeassistant:
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v4

      - name: 🛠️ Home Assistant configuration
        run: |
          mkdir ./test_configuration
          cp -r ./custom_components ./test_configuration
          echo "default_config:" >> ./test_configuration/configuration.yaml

      - name: 🏡 Home Assistant validation
        uses: ludeeus/setup-homeassistant@main
        with:
          tag: ${{ matrix.channel }}
          config-dir: test_configuration
