name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version segment to bump automatically
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure automatic releases run from main
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        shell: bash
        run: |
          echo "Release workflow_dispatch must run from main (got ${GITHUB_REF_NAME})" >&2
          exit 1

      - name: Check synchronized version sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == v* ]]; then
            python3 scripts/check_version_sync.py --with-tag "${GITHUB_REF_NAME}"
          else
            python3 scripts/check_version_sync.py
          fi

      - name: Prepare automatic release version
        id: prepare
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py --bump "${{ inputs.bump }}"
          python3 scripts/check_version_sync.py

      - name: Commit automatic release version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml custom_components/llm_gateway/manifest.json uv.lock
          git commit -m "Release ${{ steps.prepare.outputs.tag }}"
          git tag -a "${{ steps.prepare.outputs.tag }}" -m "${{ steps.prepare.outputs.tag }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${{ steps.prepare.outputs.tag }}"

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ steps.prepare.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify release tag and version files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_version_sync.py --with-tag "${{ steps.release.outputs.tag }}"

      - name: Build HACS component zip
        run: |
          cd custom_components/llm_gateway
          zip -r "${GITHUB_WORKSPACE}/llm_gateway.zip" . \
            -x "**/__pycache__/" \
            -x "**/__pycache__/*" \
            -x "**/*.pyc" \
            -x "**/.DS_Store"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: llm_gateway.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
