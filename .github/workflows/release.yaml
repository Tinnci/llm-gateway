name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: Version segment to bump automatically
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/validate.yaml

  release-zip:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Ensure automatic releases run from main
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        shell: bash
        run: |
          echo "Release workflow_dispatch must run from main (got ${GITHUB_REF_NAME})" >&2
          exit 1

      - name: Check synchronized version sources
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" == v* ]]; then
            uv run --locked python scripts/check_version_sync.py --with-tag "${GITHUB_REF_NAME}"
          else
            uv run --locked python scripts/check_version_sync.py
          fi

      - name: Prepare automatic release version
        id: prepare
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python scripts/bump_version.py --bump "${{ inputs.bump }}"
          uv run --locked python scripts/check_version_sync.py

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "tag=${{ steps.prepare.outputs.tag }}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify release tag and version files
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python scripts/check_version_sync.py --with-tag "${{ steps.release.outputs.tag }}"

      - name: Verify lockfile
        run: uv lock --check

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build Voice Harness from verified sources
        run: |
          bun install --frozen-lockfile
          bun run build:panel

      - name: Build HACS component zip
        run: |
          cd custom_components/llm_gateway
          zip -r "${GITHUB_WORKSPACE}/llm_gateway.zip" . \
            -x "__pycache__/*" "*/__pycache__/*" \
            -x "*.pyc" "*.pyo" ".DS_Store" "*/.DS_Store"

      - name: Commit automatic release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml custom_components/llm_gateway/manifest.json uv.lock
          git commit -m "Release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push --atomic origin "HEAD:main" "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: llm_gateway.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
