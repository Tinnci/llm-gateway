[project]
name = "llm-gateway"
version = "0.3.57"
description = "OpenAI-compatible LLM conversation agent for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
dependencies = [
    "mistune>=3.4.0,<4",
    "voluptuous-openapi>=0.4.1,<0.5",
]

[tool.uv]
package = false
# HA's test dependencies pin versions with published security fixes.
override-dependencies = [
    "cryptography>=50.0.0,<51",
    "pillow>=12.3.0,<13",
    "pyjwt>=2.15.0,<3",
]

[dependency-groups]
dev = [
    # Match the optional conversation component requirements of stable HA.
    "gazetteer-matcher==1.2.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.27",
    "homeassistant==2026.11.1",
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
