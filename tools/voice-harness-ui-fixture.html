            return {service_response:{status:200, content:{ok:true, config:audio, apply:{applied:true}, status:audio.audio_muted?"muted":"played", runtime:{phase:"idle", capture:"wake_word", tts_profile:"day", tts_volume:audio.tts_volume_day}}}};
          }
          if (path === "llm_gateway/harness/config/test-connection") return {ok:true, models:["voice-fast"]};
          if (path === "llm_gateway/harness/config/models") return {models:["voice-fast", "voice-mid", "voice-deep"]};
          if (path === "llm_gateway/harness/config/latency") return {results:payload.models.map((model) => ({model,ok:true,ttft_ms:125,total_ms:400,tokens:12,tps:30}))};
          if (path === "llm_gateway/harness/probe-wyoming") return {results:[{name:"Fixture ASR",connected:true,latency_ms:4,evidence:"tcp_connection"}]};
          throw new Error(`Unexpected fixture API: ${method} ${path}`);
        },
        async callService() {},
        connection: {
          async subscribeMessage(callback, message) {
            let stopped = false;
            const response = language.startsWith("zh") ? "我可以帮你了解当前房间的环境。请提供最新的传感器观测。" : "I can help with the room conditions. Please provide the latest sensor observation.";
            const parts = [...response];
            callback({type:"route",route:message.route || "fast",model:"fixture-model"});
            const timer = setInterval(() => {
              if (stopped) return;
              const text = parts.shift();
              if (text) callback({type:"token",text});
              else {clearInterval(timer); callback({type:"usage",usage:{input_tokens:38,output_tokens:24}}); callback({type:"complete",response,passed:true,violations:[],mode:"model_preview"});}
            }, 35);
            return () => {stopped = true; clearInterval(timer);};
          },
        },
      };
      if (initialTab === "settings") await panel._loadConfig();
    </script>
  </body>
</html>
